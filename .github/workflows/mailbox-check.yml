name: Mailbox check
on:
  pull_request:
    paths: ['mailbox/**']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow
      - name: Check the letters and photos in this pull request
        run: |
          git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- mailbox/ > changed.txt
          cat changed.txt
          [ -s changed.txt ] || exit 0
          xargs -a changed.txt python3 scripts/check_mailbox.py

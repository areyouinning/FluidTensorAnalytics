<style>

async function open(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},k,bytes(DATA));document.open();document.write(new TextDecoder().decode(t));document.close();}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(SALT),iterations:ROUNDS},b,256));}

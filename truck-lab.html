      if(this.path.length){ ctx.setLineDash([6,8]); ctx.strokeStyle=C.paper; ctx.lineWidth=3; ctx.beginPath(); for(var k=0;k<this.path.length;k++){ var p=this.path[k]; if(k===0)ctx.moveTo(X(p[0]),Y(p[1])); else ctx.lineTo(X(p[0]),Y(p[1])); } ctx.stroke(); ctx.setLineDash([]); }
      // the truck with its wing
      var rot=this.phase==="air"?this.rot:0, sq=this.phase==="crash"?0.6:1;

      ctx.moveTo(fr,-th/2); ctx.lineTo(fr-0.6*ch,-th/2); ctx.quadraticCurveTo(fr-0.85*ch,-th/2, bk,-th/2-cam); ctx.lineTo(bk,th/2-cam); ctx.quadraticCurveTo(fr-0.85*ch,th/2, fr-0.6*ch,th/2); ctx.lineTo(fr,th/2); ctx.closePath(); ctx.fill(); ctx.stroke();

      var V=Math.hypot(this.vx,this.vy), ad=this.phase==="air"?Math.round((this.pitch()-Math.atan2(this.vy,this.vx))*180/Math.PI):0, pd=Math.round(this.pitch()*180/Math.PI);

    }
  };

  // ---------- gadget switching ----------
  var gadButtons=[].slice.call(document.querySelectorAll(".gad"));
  function select(name){

  gadButtons.forEach(function(b){

    if(name==="squash"){ c.fillStyle=C.teal; c.beginPath(); rr(c,14,60,100,22,8); c.fill(); c.stroke(); c.fillStyle=C.ink; c.beginPath(); c.arc(34,82,10,0,TAU); c.arc(94,82,10,0,TAU); c.fill(); c.fillStyle=C.orange; c.beginPath(); rr(c,40,14,50,26,8); c.fill(); c.stroke(); }
  });

  // ---------- pointer ----------
  cv.addEventListener("pointerdown",function(ev){
    ac(); var r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top;
    pointer.down=true; pointer.x=pointer.px=x; pointer.y=pointer.py=y; pointer.t=performance.now();
    if(current.down && current.down(x,y,r.width,r.height)){ cv.setPointerCapture(ev.pointerId); cv.classList.add("grabbing"); }
  });
  cv.addEventListener("pointermove",function(ev){
    if(!pointer.down) return; var r=cv.getBoundingClientRect(), x=ev.clientX-r.left, y=ev.clientY-r.top, now=performance.now();

  });
  function upH(){ pointer.down=false; cv.classList.remove("grabbing"); if(current.up) current.up(); }
  cv.addEventListener("pointerup",upH); cv.addEventListener("pointercancel",upH);

  // ---------- loop ----------
  select("spin");
  var last=performance.now();

  }
  requestAnimationFrame(loop);

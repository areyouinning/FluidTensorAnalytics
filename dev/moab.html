const bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unzip(buf){const s=new Blob([buf]).stream().pipeThrough(new DecompressionStream('deflate'));return new Uint8Array(await new Response(s).arrayBuffer());}
async function open(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);let t=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(IV)},k,bytes(DATA)));if(ZIP)t=await unzip(t);document.open();document.write(new TextDecoder().decode(t));document.close();}
async function derive(pw){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:bytes(SALT),iterations:ROUNDS},b,256));}

document.getElementById('f').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('m'),b=document.getElementById('b');b.disabled=true;m.textContent='Checking.';
 const keep=document.getElementById('r').checked,typed=document.getElementById('p').value;   /* read before open(), which replaces this page */

 /* phones capitalize and swap dashes: also try what was typed, reduced to letters and digits and regrouped in fives */
 const plain=typed.toLowerCase().replace(/[^a-z0-9]/g,''),tries=[typed.trim()];if(plain.length===20){const g=plain.match(/.{5}/g).join('-');if(g!==tries[0])tries.push(g);}
